# ================================
# ENVIRONMENT VARIABLES
# ================================
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = GTK_THEME,Adwaita:dark
env = GDK_SCALE,1.6
env = XWAYLAND_SCALE,1.6
 
# ================================
# MONITOR
# ================================
monitor = eDP-1,preferred,0x0,1.6
 
# ================================
# XWAYLAND
# ================================
xwayland {
    force_zero_scaling = true
}
 
# ================================
# INPUT
# ================================
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    repeat_rate = 60
    repeat_delay = 300
    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0
 
    touchpad {
        natural_scroll = true
        scroll_factor = 0.2
    }
}
 
# ================================
# GESTURES (new gesture system, replaces input:workspace_swipe*)
# ================================
gestures {
    gesture = 3, horizontal, workspace
}
 
cursor {
    hide_on_key_press = true
    inactive_timeout = 10
}
 
# ================================
# LOOK AND FEEL
# ================================
general {
    border_size = 2
    gaps_in = 5
    gaps_out = 8
    col.active_border = rgb(c8c8c8) rgb(f0f0f0) 45deg   # angle now inline in the gradient
    resize_on_border = true
}
 
decoration {
    rounding = 7
    rounding_power = 8
    active_opacity = 1
    inactive_opacity = 0.9
 
    blur {
        enabled = true
        size = 3
        noise = 0.1
    }
 
    shadow {
        enabled = true
    }
}
 
animations {
    enabled = true
}
 
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
 
master {
    new_status = slave
    new_on_top = true
    orientation = left
    mfact = 0.5
}
 
dwindle {
    force_split = 2
}
 
# ================================
# BEZIERS & ANIMATIONS
# ================================
bezier = easeOutQuint,0.23,1,0.32,1
bezier = easeInOutCubic,0.65,0.05,0.36,1
bezier = linear,0,0,1,1
bezier = almostLinear,0.5,0.5,0.75,1
bezier = quick,0.15,0,0.1,1
 
animation = global,1,10,default
animation = border,1,5.39,easeOutQuint
animation = windows,1,4.79,easeOutQuint
animation = windowsIn,1,4.1,easeOutQuint,popin 87%
animation = windowsOut,1,1.49,linear,popin 87%
animation = fadeIn,1,1.73,almostLinear
animation = fadeOut,1,1.46,almostLinear
animation = fade,1,3.03,quick
animation = layers,1,3.81,easeOutQuint
animation = layersIn,1,4,easeOutQuint,fade
animation = layersOut,1,1.5,linear,fade
animation = fadeLayersIn,1,1.79,almostLinear
animation = fadeLayersOut,1,1.39,almostLinear
animation = workspaces,1, 3, easeOutQuint,slide
animation = workspacesIn,1, 3, easeOutQuint,slide
animation = workspacesOut,1, 3, easeOutQuint,slide
animation = zoomFactor,1,7,quick
 
# ================================
# KEYBINDINGS
# ================================
 
# ---- Wallpaper switcher ----
bind = SUPER SHIFT, P, exec, $HOME/.config/hypr/scripts/rotate_wallpaper.sh
 
# ---- Запуск приложений ----
bind = SUPER, Q, exec, kitty
bind = SUPER, E, exec, nautilus
bind = SUPER, B, exec, firefox
bind = SUPER, R, exec, wofi --show drun
 
# ---- Скриншоты ----
bind = SUPER SHIFT, S, exec, hyprshot -m region
 
# ---- Блокировка ----
bind = SUPER, L, exec, hyprlock
 
# ---- Quickshell IPC ----
#bind = SUPER, SPACE, exec, qs -p $HOME/.config/quickshell/minimalBar ipc call launcher toggle
bind = SUPER ALT, SPACE, exec, qs -p $HOME/.config/quickshell/minimalBar ipc call rightIsland toggle
bind = SUPER, N, exec, qs -p $HOME/.config/quickshell/minimalBar ipc call notifications toggle
bind = SUPER SHIFT, SPACE, exec, qs -p $HOME/.config/quickshell/minimalBar ipc call bar toggle
 
# ---- Выход ----
bind = SUPER, M, exec, hyprctl dispatch exit
 
# ---- Управление окнами ----
bind = SUPER, C, killactive
bind = SUPER, V, togglefloating
bind = SUPER, F, fullscreenstate, 2 0
bind = SUPER, P, pseudo
 
# ---- Фокус ----
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
 
# ---- Обмен окнами ----
bind = SUPER SHIFT, left, swapwindow, l
bind = SUPER SHIFT, right, swapwindow, r
bind = SUPER SHIFT, up, swapwindow, u
bind = SUPER SHIFT, down, swapwindow, d
 
# ---- Рабочие столы 1–9 ----
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
 
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
 
# ---- Специальный workspace (scratchpad) ----
bind = SUPER, S, togglespecialworkspace, magic
 
# ---- Переключение рабочих столов колёсиком мыши ----
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
 
# ---- Перетаскивание и изменение размера мышью ----
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
 
# ---- Громкость, яркость, медиа ----
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
 
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPrev, exec, playerctl previous
 
# ---- Кнопка питания ----
bind = , XF86PowerOff, exec, qs -p $HOME/.config/quickshell/minimalBar ipc call powerMenu toggle
 
# ---- Скриншоты (Grim) ----
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Monitor copied to clipboard" -i clipboard
bind = SUPER, Print, exec, grim -o "$(hyprctl monitors -j | jq -r '.[] | select(.focused) | .name')" - | wl-copy && notify-send "Screenshot" "Monitor copied to clipboard" -i clipboard
 
# ================================
# WINDOW RULES (current windowrule syntax, post windowrulev2 deprecation)
# ================================
 
# Подавление максимизации
windowrule = suppress_event maximize, match:class .*
 
# Фикс для XWayland перетаскиваний
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
 
# hyprland-run
windowrule = float on, match:class hyprland-run
windowrule = move 20 monitor_h-120, match:class hyprland-run
 
# wiremix
windowrule = float on, match:title ^wiremix-term$, match:class com.mitchellh.ghostty
windowrule = move 1307 51, match:title ^wiremix-term$, match:class com.mitchellh.ghostty
windowrule = size 600 400, match:title ^wiremix-term$, match:class com.mitchellh.ghostty
 
# bluetui
windowrule = float on, match:title ^bluetui-term$, match:class com.mitchellh.ghostty
windowrule = move 1307 51, match:title ^bluetui-term$, match:class com.mitchellh.ghostty
windowrule = size 600 800, match:title ^bluetui-term$, match:class com.mitchellh.ghostty
 
# impala
windowrule = float on, match:title ^impala-term$, match:class com.mitchellh.ghostty
windowrule = move 1307 51, match:title ^impala-term$, match:class com.mitchellh.ghostty
windowrule = size 600 800, match:title ^impala-term$, match:class com.mitchellh.ghostty
 
# sysmenu-tui
windowrule = float on, match:title ^sysmenu-tui$, match:class com.mitchellh.ghostty
windowrule = center on, match:title ^sysmenu-tui$, match:class com.mitchellh.ghostty
windowrule = size 900 600, match:title ^sysmenu-tui$, match:class com.mitchellh.ghostty
 
# rencal
windowrule = float on, match:class ^rencal$
windowrule = center on, match:class ^rencal$
windowrule = size 66% 66%, match:class ^rencal$
 
# NautilusPreview
windowrule = float on, match:class ^org.gnome.NautilusPreviewer$
windowrule = center on, match:class ^org.gnome.NautilusPreviewer$
windowrule = size 900 600, match:class ^org.gnome.NautilusPreviewer$
 
# Apple Music PWA
windowrule = workspace 5 silent, match:class ^chrome-blgdilankhbcpipclgpdndahbehalgkh-Default$
windowrule = no_shadow on, match:class ^chrome-blgdilankhbcpipclgpdndahbehalgkh-Default$
windowrule = opacity 1.0 override, match:class ^chrome-blgdilankhbcpipclgpdndahbehalgkh-Default$
 
# ================================
# AUTOSTART (exec-once)
# ================================
 
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user start hyprland-session.target
exec-once = qs -p $HOME/.config/quickshell/minimalBar
exec-once = awww-daemon
exec-once = nm-applet
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-paste --type image --watch $HOME/dotfiles/scripts/cliphist-export-live
exec-once = sh -c 'eval $(gnome-keyring-daemon --start --components=secrets) && systemctl --user import-environment GNOME_KEYRING_CONTROL SSH_AUTH_SOCK'
